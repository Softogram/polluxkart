name: tooling-tests

# Unit tests for the repository's own tooling, run through make ci-tooling.
# Standard library Python only.
#
# Owner decision, 2026-09-16: never per PR into development. Runs on a push
# to main (a release) and when someone starts the workflow by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned actionlint and ShellCheck
        run: python3 tools/checks/install_linters.py

      - name: Check this machine has the tools
        run: make doctor

      - name: Run the tooling checks
        run: make ci-tooling
