name: tooling-tests

# Unit tests for the repository's own tooling: the approval gate, the
# Claude Code approval-label guard hook, and the board sync. Standard library Python only.
#
# Owner decision, 2026-09-16: never per PR into development. Runs on a push
# to main (a release) and when someone starts the workflow by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the approval gate
        run: python3 -m unittest discover -s tools/approval_gate -v

      - name: Test the approval label guard hook
        run: python3 -m unittest discover -s .claude/hooks -v

      - name: Test the board sync
        run: python3 -m unittest discover -s tools/board -v
