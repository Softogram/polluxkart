name: tooling-tests

# Unit tests for the repository's own tooling: the approval gate and the
# Claude Code approval-label guard hook. Standard library Python only.

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the approval gate
        run: python3 -m unittest discover -s tools/approval_gate -v

      - name: Test the approval label guard hook
        run: python3 -m unittest discover -s .claude/hooks -v
