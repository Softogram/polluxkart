name: codeql

# CodeQL, GitHub's code scanner, in advanced setup: the configuration is a
# file in this repository, so it is reviewed like any other change, and it
# can skip legacy/.
#
# Owner decision, 2026-09-16: CodeQL does not run on every pull request, so
# it cannot block a merge. It runs at release (a push to main), weekly so
# new CodeQL rules reach code nobody has touched, and by hand. Findings go
# to the Security tab for the owner.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions covers the workflow files, python the repository tooling.
        # java-kotlin arrives with api/ (E03-02) and javascript-typescript
        # with web/ (E04-01); a test fails if a folder exists without its
        # language here.
        language: [actions, python]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
